<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Company Brain Transit Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Concept: the company is a transit map. Things are stations, each fact draws one line, a question is a signal walking back from the target.
   Single light "printed map" look by choice. */
:root{
  color-scheme:light;
  --paper:#F1F3F5; --sheet:#FFFFFF; --ink:#141A24; --muted:#5D6776; --rule:#D3D9E0;
  --dep:#E2412A; --mig:#1F62D4; --own:#7D8796; --perm:#8A4ED0; --stale:#E39A14; --ok:#17955A; --bad:#D22F28;
  --f-sign:"Overpass", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"Overpass Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-sign);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mig);outline-offset:2px}

header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-block:14px 8px;max-width:1360px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.roundel{width:30px;height:30px;border-radius:50%;border:6px solid var(--dep);position:relative;flex:none}
.roundel::after{content:"";position:absolute;left:-9px;right:-9px;top:50%;height:7px;margin-top:-3.5px;background:var(--mig)}
.brand b{font-weight:900;font-size:1.15rem;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:.9rem}
.lines-key{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.lines-key span{display:inline-flex;align-items:center;gap:6px}
.lines-key i{width:22px;height:0;border-top:5px solid var(--dep);border-radius:3px}
.lines-key i.m{border-color:var(--mig)} .lines-key i.o{border-top:3px dotted var(--own)} .lines-key i.p{border-top:3px dashed var(--perm)} .lines-key i.s{border-color:var(--stale)} .lines-key i.x{border-top:3px dashed #B9C1CB}

.theatre{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;max-width:1360px;width:100%;margin:0 auto;padding-bottom:12px;min-height:0}
@media (max-width:980px){.theatre{grid-template-columns:1fr}}
.stagewrap{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:auto;min-width:0;align-self:start}
#stage{display:block;width:100%;min-width:680px;height:auto}
.story{display:flex;flex-direction:column;gap:12px;min-width:0}
.sc-n{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sc-n b{color:var(--ink)}
.story h2{font-weight:900;font-size:clamp(1.5rem,2.4vw,2rem);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
.cap{font-size:1.06rem;line-height:1.5;margin:0;text-wrap:pretty}
.tech{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);border-left:3px solid var(--rule);padding:2px 0 2px 10px;margin:0;overflow-wrap:anywhere}
.extra{display:flex;flex-direction:column;gap:10px}
.box{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px 14px}
.box h4{margin:0 0 6px;font-size:.72rem;font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* verdict card */
.verdict .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.stamp{font-weight:900;letter-spacing:.06em;font-size:.95rem;padding:3px 10px;border-radius:4px;border:2.5px solid currentColor;text-transform:uppercase}
.st-blocked{color:var(--bad)} .st-needs{color:var(--stale)} .st-clear{color:var(--ok)}
.rev{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.vlist li{display:grid;grid-template-columns:14px 1fr;gap:8px;font-size:.9rem;animation:rise .45s ease both}
.vlist li i{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--dep)}
.vlist li i.m{background:var(--mig)} .vlist li i.p{background:var(--perm)} .vlist li i.s{background:var(--stale)} .vlist li i.o{background:var(--own)} .vlist li i.k{background:var(--ok)} .vlist li i.c{background:var(--bad);border-radius:2px;transform:rotate(45deg)}
.vlist small{display:block;font-family:var(--f-mono);font-size:.7rem;color:var(--muted);overflow-wrap:anywhere}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.agent{display:flex;flex-direction:column;gap:8px}
.bubble{background:var(--ink);color:var(--paper);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:.95rem;min-height:3em}
.call{font-family:var(--f-mono);font-size:.76rem;background:var(--sheet);border:1.5px solid var(--mig);border-radius:8px;padding:8px 10px;color:var(--mig);overflow-wrap:anywhere;animation:rise .45s ease both}
.checks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:.88rem}
.checks li{opacity:.35;transition:opacity .3s}
.checks li.on{opacity:1}
.checks li.on::before{content:"✓ ";color:var(--ok);font-weight:900}
.counter{font-weight:900;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.toggle{display:flex;gap:6px;flex-wrap:wrap}
.tg{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:.88rem}
.tg.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hist{font-family:var(--f-mono);font-size:.74rem;display:flex;flex-direction:column;gap:4px}
.hist .old{color:var(--muted);text-decoration:line-through}
.receipt{font-size:.86rem}
.receipt q{display:block;font-family:var(--f-mono);font-size:.76rem;background:var(--paper);border-radius:6px;padding:8px;margin:6px 0;quotes:none}
.range{width:100%;accent-color:var(--mig)}
.ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.qchips{display:flex;flex-direction:column;gap:6px}
.qchip{text-align:left;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:.9rem;display:flex;flex-direction:column;gap:2px}
.qchip.on{border-color:var(--ink)}
.qchip small{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.proof{font-size:.85rem;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.proof b{display:block;font-size:.72rem;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.proof .y b{color:var(--ok)} .proof .n b{color:var(--stale)}
.proof ul{margin:4px 0 0;padding-left:16px}

/* controls */
.controls{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--rule);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));max-width:1360px;width:100%;margin:0 auto;display:flex;align-items:center;gap:10px}
.cbtn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:999px;width:40px;height:40px;cursor:pointer;display:grid;place-items:center;font-weight:900;flex:none}
.cbtn.play{background:var(--ink);color:var(--paper);width:auto;padding:0 16px;gap:6px;display:flex;align-items:center}
.route{flex:1;display:flex;align-items:center;min-width:0;overflow-x:auto;padding:14px 4px 4px;position:relative}
.route::before{content:"";position:absolute;left:10px;right:10px;top:21px;height:4px;background:var(--rule);border-radius:2px}
.stop{position:relative;flex:1 0 34px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;cursor:pointer;padding:0}
.stop span{width:14px;height:14px;border-radius:50%;background:var(--sheet);border:3px solid var(--rule);position:relative;z-index:1}
.stop.done span{border-color:var(--ink);background:var(--ink)}
.stop.on span{border-color:var(--dep);background:var(--sheet);transform:scale(1.35)}
.stop em{font-style:normal;font-size:.62rem;font-family:var(--f-mono);color:var(--muted);white-space:nowrap;height:1em}
.stop.on em{color:var(--ink);font-weight:600}

/* ---------- SVG ---------- */
svg text{font-family:var(--f-sign)}
.halo{paint-order:stroke;stroke:var(--sheet);stroke-width:5px;stroke-linejoin:round}
.frame{fill:none;stroke:var(--ink);stroke-width:2}
.frame-tag rect{fill:var(--ink)} .frame-tag text{fill:var(--sheet);font-weight:800;font-size:12px;letter-spacing:.12em}
.revchip rect{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5} .revchip text{font-family:var(--f-mono);font-size:11px;fill:var(--ink)}

.ln path.p{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln-dep path.p{stroke:var(--dep);stroke-width:9}
.ln-mig path.p{stroke:var(--mig);stroke-width:9}
.ln-own path.p{stroke:var(--own);stroke-width:3;stroke-dasharray:1 7}
.ln-perm path.p{stroke:var(--perm);stroke-width:4;stroke-dasharray:10 7}
.ln-rst path.p{stroke:var(--dep);stroke-width:6;stroke-dasharray:12 8}
.ln.stale path.p{stroke:var(--stale)}
.ln.replaced path.p{stroke:#BCC4CE;stroke-width:5;stroke-dasharray:10 8}
.ln.replaced text.rl{fill:#9AA4B1;text-decoration:line-through}
.ln.faint{opacity:.22}
.ln path.hit{fill:none;stroke:transparent;stroke-width:24;cursor:pointer}
.ln text.rl{font-size:11.5px;font-weight:600;fill:var(--muted)}
.ln.flash path.p{animation:flash .7s ease 2}
@keyframes flash{50%{stroke-width:16;opacity:.75}}

.trace{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:15;opacity:.95}
.tr-dep{stroke:var(--dep)} .tr-mig{stroke:var(--mig)} .tr-perm{stroke:var(--perm)} .tr-own{stroke:var(--own)} .tr-stale{stroke:var(--stale)}
.trace.glow{stroke-width:22;opacity:.18}
.dot{stroke:var(--sheet);stroke-width:3}
circle.tr-dep,circle.tr-mig,circle.tr-perm,circle.tr-own,circle.tr-stale{stroke:var(--sheet)}
circle.tr-dep{fill:var(--dep)} circle.tr-mig{fill:var(--mig)} circle.tr-perm{fill:var(--perm)} circle.tr-own{fill:var(--own)} circle.tr-stale{fill:var(--stale)}

.st .c{fill:var(--sheet);stroke:var(--ink);stroke-width:4}
.st-team .c{stroke:var(--own);stroke-width:3}
.st-decision .c{stroke:var(--perm)}
.st-task .c{stroke:var(--mig)}
.st.target .c{fill:var(--ink)}
.st .ring{fill:none;stroke:var(--dep);stroke-width:3}
.st .nm{font-weight:800;font-size:14px;fill:var(--ink)}
.st .kd{font-family:var(--f-mono);font-size:9.5px;fill:var(--muted);letter-spacing:.08em}
.st.dim{opacity:.28}
.st.lit .c{fill:var(--dep);stroke:var(--ink)}
.st.lit-mig .c{fill:var(--mig)}
.st.lit-own .c{fill:var(--own)}
.st.lit-perm .c{fill:var(--perm)}
.st.lit-stale .c{fill:var(--stale)}
.st.lit-ok .c{fill:var(--ok)}
.st-in{transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
.ping{fill:none;stroke:var(--dep);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ping 1.6s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(3.8);opacity:0}}
.bigping{fill:none;stroke:var(--ok);stroke-width:4;transform-box:fill-box;transform-origin:center;animation:bigping 2.4s ease-out 2 forwards}
@keyframes bigping{from{transform:scale(1);opacity:.9}to{transform:scale(21);opacity:0}}

.bdg rect{stroke:none} .bdg text{font-family:var(--f-mono);font-size:10.5px;font-weight:600}
.b-open rect{fill:#FBE0DE} .b-open text{fill:var(--bad)}
.b-warn rect{fill:#FCEBC8} .b-warn text{fill:#94600A}
.b-ok rect{fill:#D7F0E3} .b-ok text{fill:#0E6D41}
.b-ink rect{fill:var(--ink)} .b-ink text{fill:var(--sheet)}
.bdg{animation:pop .4s cubic-bezier(.2,1.6,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(.2);opacity:0}}

.callout rect{fill:var(--ink)} .callout text{fill:var(--sheet);font-size:12px;font-weight:600}
.callout.c-stale rect{fill:#94600A} .callout.c-perm rect{fill:var(--perm)} .callout.c-ok rect{fill:var(--ok)} .callout.c-bad rect{fill:var(--bad)}
.callout{animation:pop .4s cubic-bezier(.2,1.6,.4,1) both;transform-box:fill-box;transform-origin:center}

.card .bg{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5;filter:drop-shadow(0 3px 5px rgba(20,26,36,.12))}
.card .hd{fill:var(--ink)}
.card .who{fill:var(--sheet);font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.04em}
.card .tx{font-family:var(--f-mono);font-size:12px;fill:var(--ink)}
.card.chat .hd{fill:var(--perm)} .card.new .hd{fill:var(--mig)}
.card .ul{fill:none;stroke:var(--mig);stroke-width:3}
.bob{animation:bob 3.6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}

.tk rect{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}
.tk circle{fill:var(--dep)}
.tk.m circle{fill:var(--mig)} .tk.o circle{fill:var(--own)} .tk.p circle{fill:var(--perm)} .tk.s circle{fill:var(--ink)}
.tk text{font-family:var(--f-mono);font-size:11.5px;fill:var(--ink)}
.tk.bad rect{stroke:var(--bad);stroke-dasharray:5 4;fill:#FDF1F0}
.tk.bad circle{fill:var(--bad)}

.gate .post{fill:var(--ink)}
.gate .lamp{fill:#C6CDD5;stroke:var(--ink);stroke-width:2;transition:fill .15s}
.gate .lamp.ok{fill:var(--ok)} .gate .lamp.no{fill:var(--bad)}
.gate text{font-size:12px;font-weight:600;fill:var(--ink)}
.gate .gt{font-weight:900;font-size:13px;letter-spacing:.14em}
.tray rect{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5}
.tray text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.big rect.bg{fill:var(--sheet);stroke:var(--mig);stroke-width:2.5}
.big .pill rect{fill:var(--ink)} .big .pill text{fill:var(--sheet);font-weight:800;font-size:15px}
.big .rel{font-weight:900;font-size:14px;fill:var(--dep)}
.big .fk{font-family:var(--f-mono);font-size:10px;fill:var(--muted);letter-spacing:.08em}
.big .fv{font-family:var(--f-mono);font-size:12.5px;fill:var(--ink)}
.spark{fill:none;stroke:var(--bad);stroke-width:3;stroke-linejoin:round;animation:spark .25s steps(2) infinite}
@keyframes spark{50%{opacity:.25}}
.repl{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-dasharray:5 4}
.repl-t{font-weight:800;font-size:12px;fill:var(--ink)}
.stampbig{font-weight:900;font-size:30px;letter-spacing:.08em}
.stampbig rect{fill:none;stroke-width:4}
.lock{font-family:var(--f-mono);font-size:11px;fill:var(--ink)}
.fogged{opacity:.18}
#stage .trace,#stage .dot,#stage .callout,#stage .spark,#stage .card,#stage .tk,#stage .gate,#stage .big,#stage .bdg,#stage .ping,#stage .bigping,#stage .stampbig,#stage .repl,#stage .repl-t{pointer-events:none}
.scanbar{fill:var(--mig);opacity:.12}
.scanline{stroke:var(--mig);stroke-width:3}
@media (prefers-reduced-motion: reduce){.bob,.ping,.spark{animation:none}}

.tk.prop rect{stroke:var(--muted);stroke-dasharray:6 4;fill:var(--paper)}
.tk.prop circle{fill:var(--muted)}
.tk.okd rect{stroke:var(--ok);stroke-width:2.5}
.tk.okd circle{fill:var(--ok)}
.sb-h{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;fill:var(--muted);font-weight:700}
.sb-c{font-size:15px;font-weight:700;fill:var(--ink)}
.sb-y{font-size:17px;font-weight:900;fill:var(--ok)}
.sb-n{font-size:17px;font-weight:900;fill:var(--bad)}
.sb-bar-g{fill:var(--dep)}
.sb-bar-s{fill:var(--muted)}
.sb-num{font-family:var(--f-mono);font-size:11px;fill:var(--ink)}
.sb-tot{font-size:30px;font-weight:900}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><div class="roundel" aria-hidden="true"></div><div><b>Company Brain</b> <span>· one question, ridden through FalkorDB</span></div></div>
  <div class="lines-key" aria-label="Map key">
    <span><i></i>depends / runs on</span><span><i class="m"></i>migration</span><span><i class="o"></i>owned by</span><span><i class="p"></i>allowed by</span><span><i class="s"></i>old evidence</span><span><i class="x"></i>replaced</span>
  </div>
</header>

<div class="theatre">
  <div class="stagewrap"><svg id="stage" viewBox="0 0 1000 620" role="img" aria-label="Animated map of the Company Brain graph"></svg></div>
  <aside class="story" aria-live="polite">
    <div class="sc-n" id="scn"></div>
    <h2 id="title"></h2>
    <p class="cap" id="cap"></p>
    <p class="tech" id="tech"></p>
    <div class="extra" id="extra"></div>
    <div class="box receipt" id="receipt" hidden></div>
  </aside>
</div>

<div class="controls">
  <button class="cbtn" id="prev" aria-label="Previous scene">‹</button>
  <button class="cbtn play" id="play" aria-pressed="false">▶ <span>Play</span></button>
  <button class="cbtn" id="next" aria-label="Next scene">›</button>
  <div class="route" id="route" role="group" aria-label="Scenes"></div>
  <button class="cbtn" id="again" aria-label="Replay this scene" title="Replay scene">↻</button>
</div>

<script>
(()=>{
const NS='http://www.w3.org/2000/svg', SVG=document.getElementById('stage');
const $=id=>document.getElementById(id);
const mk=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const tx=(p,x,y,s,cls='',anc='start')=>{const t=mk('text',{x,y,class:cls,'text-anchor':anc},p);t.textContent=s;return t};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches, SP=RM?0.03:1;
const L={}; ['frame','lines','fx','stations','cards'].forEach(k=>L[k]=mk('g',{},SVG));
let token=0; const STOP=Symbol('stop');

/* ---------- the map (fixture: data/synthetic/*.json, production/eu) ---------- */
const ST={
 mb:{x:110,y:230,n:'Monthly billing',k:'workflow',lab:[0,34,'middle']},
 ie:{x:330,y:230,n:'Invoice export',k:'job',lab:[0,36,'middle']},
 rv2:{x:620,y:230,n:'Runner v2',k:'service',lab:[0,-22,'middle']},
 lr:{x:620,y:370,n:'Legacy runner',k:'service · target',lab:[30,-2,'start']},
 mr:{x:110,y:520,n:'Monthly reporting',k:'workflow',lab:[0,34,'middle']},
 rj:{x:330,y:520,n:'Reporting job',k:'job',lab:[0,34,'middle']},
 im:{x:330,y:100,n:'Invoice migration',k:'task',lab:[0,-22,'middle']},
 na:{x:620,y:100,n:'Network approval',k:'task',lab:[0,-22,'middle']},
 sec:{x:850,y:100,n:'Security',k:'team',lab:[0,-22,'middle']},
 dp:{x:200,y:430,n:'Data platform',k:'team',lab:[-20,4,'end']},
 te:{x:150,y:120,n:'Temporary exception',k:'decision',lab:[0,-22,'middle']},
};
const KIND={workflow:'workflow',job:'job',service:'service','service · target':'service',task:'task',team:'team',decision:'decision'};
const ED={
 run_i:{t:'dep',pts:[[330,230],[470,370],[620,370]],lab:[548,360],rl:'runs on',id:'run-invoice-legacy',src:'source-run-invoice-legacy@1',q:'Configuration observation 2026-10-17T09:00:00Z: invoice-export runs on legacy-runner in production/eu.',seen:'17 Oct 09:00',m:'parsed'},
 req_b:{t:'dep',pts:[[110,230],[330,230]],lab:[220,218],rl:'requires',id:'requires-billing-invoice',src:'source-requires-billing-invoice@1',q:'Monthly billing requires invoice-export in production/eu.',seen:'17 Oct 09:00',m:'seeded'},

/* static map for a given data state (1..4) */
function mapState(state,{rev=true,lines=true}={}){
  frame(rev?REVS[state]:null);
  if(lines){
    BASE.forEach(k=>{let c=''; if(k==='run_i'&&state>=3)c='replaced'; if(k==='run_r'&&state>=4)c='replaced'; line(k,{cls:c})});
    if(state>=3)line('run_v');
  }
  Object.keys(ST).forEach(k=>station(k,{dim:k==='rv2'&&state<3}));
  if(state===1){badge('im','open','b-open');badge('na','open','b-open')}
  if(state===2){badge('im','open + “done”?','b-warn');badge('na','open','b-open')}
  if(state>=3){badge('im','complete ✓','b-ok');badge('na','complete ✓','b-ok')}
  if(state>=4)badge('rj','verified clear ✓','b-ok');
}

/* a signal walking a line, optionally backwards */
function trace(k,w,{rev=true,c='tr-dep',dur=900,stay=true}={}){
  const e=ED[k], pts=rev?[...e.pts].reverse():e.pts;
  const glow=mk('path',{d:dpath(pts),class:'trace glow '+c},L.fx);
  const p=mk('path',{d:dpath(pts),class:'trace '+c},L.fx), len=p.getTotalLength();
  [p,glow].forEach(x=>{x.style.strokeDasharray=len;x.style.strokeDashoffset=len});
  const dot=mk('circle',{r:9,class:'dot '+c},L.fx);
  const D=Math.max(1,dur*SP), t0=performance.now(), tk=w.tk;
  return new Promise((res,rej)=>{
    const f=t=>{ if(tk!==token){rej(STOP);return}
      const u=Math.min(1,(t-t0)/D), q=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2, pt=p.getPointAtLength(len*q);
      dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);
      p.style.strokeDashoffset=glow.style.strokeDashoffset=len*(1-q);
      if(u<1)requestAnimationFrame(f); else {dot.remove(); if(!stay){p.remove();glow.remove()} res()}};
    requestAnimationFrame(f);
  });
}
function traced(keys,c='tr-dep'){keys.forEach(k=>{[0,1].forEach(i=>mk('path',{d:dpath(ED[k].pts),class:'trace '+(i?'':'glow ')+c},L.fx))})}

{stop:'review',title:'An AI suggests. A person approves.',
 cap:'Now a real AI model (GPT-6 Luna) reads the raw records and proposes facts. They pass the checkpoint, but <b>proposals don\'t count</b>, so the answer stays "needs verification". A reviewer checks four of them against their source and approves them. Ask again: the answer becomes <b>blocked</b>. The other seven stay proposals, and asking "as of before the review" still gives the old answer.',
 tech:'company-brain approve-proposals --proposal … --actor … --reviewed-at … · approved copies + immutable review audit in FalkorDB (APPROVES / REVIEWED_FROM) · approval time filtered in Cypher · no MCP write tool',
 async run(w){reset();
  const P=[['invoice-export → runs on → legacy-runner',1],['billing → requires → invoice-export',1],['invoice-export → owned by → data-platform',1],['exception → allows → invoice-export until 1 Nov',1],
   ['reporting → requires → report-job',0],['report-job → runs on → legacy-runner',0],['migration → blocked by → network-approval',0],['report-job → owned by → data-platform',0],
   ['network-approval → owned by → security',0],['invoice-migration · status open',0],['network-approval · status open',0]];
  tx(L.cards,30,30,'LIVE AI PROPOSALS · 11 · inactive','sb-h');
  tx(L.cards,560,30,'APPROVED · these count','sb-h');
  const tks=P.map(([t],i)=>{const g=ticket(t,'prop',360);place(g,20,46+i*44,{o:0});return g});

  verdictBox('needs','before review');
  vrow('s','Proposals alone change nothing','11 proposals · 0 approved');

  extra().innerHTML='';
  verdictBox('blocked','after review');
  vrow('','Billing → Invoice export → Legacy runner','approved runtime + prerequisite');
  vrow('o','Data platform owns invoice export','approved roster fact');
  vrow('p','Exception allows use until 1 Nov','approved dated permission');
  vrow('s','7 proposals still inactive','not batch-approved');
  box('Time travel still works','Ask with a knowledge time <b>before</b> the review → still <b>needs verification</b>. Approval is never retroactive.');
  stampOnMap('BLOCKED','var(--bad)',760,500); await w(1200)}},

  const b=box('Try a question','<div class="qchips" id="qc"></div>');
  Q.forEach(([q,s,f],i)=>{const btn=document.createElement('button');btn.className='qchip';btn.innerHTML=q+'<small>'+s+'</small>';
    btn.onclick=()=>{document.querySelectorAll('.qchip').forEach(x=>x.classList.toggle('on',x===btn));L.fx.innerHTML='';const tk=token;const w2=ms=>new Promise((res,rej)=>setTimeout(()=>tk===token?res():rej(STOP),ms*SP));w2.tk=tk;Promise.resolve(f(w2)).catch(()=>{})};$('qc').appendChild(btn)});
  box('Where it stands','<div class="proof"><div class="y"><b>Proven</b><ul><li>229 tests, 15 on real FalkorDB</li><li>3/3 clean replays, 12/12 expected verdicts</li><li>live AI proposals + explicit approval</li><li>real MCP client kept verdict and 13 citations</li><li>graph 6/6 vs search 4/6</li><li>no leaks to hidden viewers</li></ul></div><div class="n"><b>Next</b><ul><li>real company connectors</li><li>production identity</li><li>scale testing</li><li>more question types</li></ul></div></div>');
  await w(300);document.querySelectorAll('.qchip')[1].click();await w(1800)}},
];

/* ---------- player ---------- */
let cur=0, playing=false;
const route=$('route');
SC.forEach((s,i)=>{const b=document.createElement('button');b.className='stop';b.innerHTML='<span></span><em>'+s.stop+'</em>';b.setAttribute('aria-label','Scene '+(i+1)+': '+s.title);b.onclick=()=>go(i);route.appendChild(b)});
async function go(i){
  cur=(i+SC.length)%SC.length; const my=++token; const s=SC[cur];
  [...route.children].forEach((b,j)=>b.className='stop'+(j===cur?' on':j<cur?' done':''));
  route.children[cur].scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
  $('scn').innerHTML='Scene <b>'+(cur+1)+'</b> of '+SC.length;
  $('title').textContent=s.title; $('cap').innerHTML=s.cap; $('tech').textContent=s.tech;
  try{history.replaceState(null,'','#s'+(cur+1))}catch(e){}
  const w=ms=>new Promise((res,rej)=>setTimeout(()=>my===token?res():rej(STOP),ms*SP)); w.tk=my;
  try{ await s.run(w); if(playing&&my===token){await w(3200); if(cur<SC.length-1)go(cur+1); else setPlay(false)} }
  catch(e){ if(e!==STOP)console.error(e) }
}
function setPlay(p){playing=p;$('play').setAttribute('aria-pressed',String(p));$('play').innerHTML=p?'❚❚ <span>Pause</span>':'▶ <span>Play</span>'}
$('play').onclick=()=>{setPlay(!playing); if(playing)go(cur)};
$('prev').onclick=()=>go(cur-1); $('next').onclick=()=>go(cur+1); $('again').onclick=()=>go(cur);
document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;
  if(e.key==='ArrowRight'){e.preventDefault();go(cur+1)} else if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1)}
  else if(e.key===' '&&!e.target.matches('button')){e.preventDefault();$('play').click()} else if(e.key==='r'||e.key==='R')go(cur)});
const fromHash=()=>{const m=/^#s(\d+)$/.exec(location.hash);return m?Math.min(SC.length,Math.max(1,+m[1]))-1:0};
window.addEventListener('hashchange',()=>go(fromHash())); go(fromHash());
})();
</script>
