[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "company-brain"
version = "0.1.0"
description = "Evidence-backed service retirement assessments over FalkorDB"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "falkordb>=1.2,<2", "mcp>=1.20,<2", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
company-brain = "company_brain.cli:main"
company-brain-mcp = "company_brain.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires explicitly enabled isolated FalkorDB"]
asyncio_mode = "auto"
